# keel configuration. Written by `keel init --write`; edit freely.
version: 1
flow_default: full

runtime:
  services: {{SERVICES}}      # docker | external | none
  app: host                   # host | container
  agent: host                 # host | devcontainer

backend:
  dir: {{BACKEND_DIR}}
  build: {{BUILD}}
  migrations: src/main/resources/db/migration
frontend:
  dir: {{FRONTEND_DIR}}
  package_manager: {{PM}}
  generated: src/api/generated
contract:
  file: {{CONTRACT}}
e2e:
  dir: {{E2E_DIR}}
  web_url: {{WEB_URL}}
  api_url: http://localhost:8080
smoke:
  dir: smoke
  max_seconds: 60
specs:
  dir: specs

base_branch: main

# Every command keel runs lives here. `keel doctor` lists which are set and which
# tiers need them; a required command that is blank makes its tier fail loudly
# rather than passing with the check silently skipped.
#
# Working directory, because it is not the same for every key and nothing else says so:
#   api_*, coverage_api, migrate, unit_tests, testcontainers_test, deps_api  ->  backend.dir
#   web_*, coverage_web, deps_web                                           ->  frontend.dir
#   e2e, smoke_e2e                                                          ->  e2e.dir
#   contract_lint, codegen, static_checks, api_health_check,
#   web_health_check, smoke                                                 ->  the repo root
# A relative command is resolved from there, so `cd frontend && ...` in a web_* key is one
# directory too deep. If the directory does not exist keel runs at the repo root and says so.
commands:
  api_compile: {{BUILD}} -q compileKotlin compileTestKotlin
  api_test_ac: {{BUILD}} -q test --tests '*{AC}*'
  api_test_module: {{BUILD}} -q test
  api_test_pkg: {{BUILD}} -q test --tests '{PKG}.*'
  web_typecheck: npx tsc --noEmit
  web_test_ac: {{WEB_TEST_AC}}
  web_test_module: {{WEB_TEST_MODULE}}
  web_test_paths: {{WEB_TEST_PATHS}}
  coverage_api: {{COVERAGE_API}}
  coverage_web: {{COVERAGE_WEB}}
  e2e: {{E2E_CMD}}
  smoke_e2e: {{SMOKE_E2E_CMD}}
  # Left blank on purpose: stack packs in the plugin's stacks/ fill these in per stack
  # (static_checks becomes detekt + ktlint + eslint), and the run ladder records what
  # actually worked. Set one here only to override.
  contract_lint: ''           # e.g. npx @redocly/cli lint {{CONTRACT}}
  codegen: ''                 # e.g. {{BUILD}} -q openApiGenerate && npx orval
  static_checks: ''           # filled from the stack packs; set to override
  migrate: ''                 # e.g. {{BUILD}} -q flywayMigrate
  testcontainers_test: ''     # one container-backed test, for the run ladder
  api_health_check: ''        # e.g. curl -fsS http://localhost:8080/actuator/health
  web_health_check: ''        # e.g. curl -fsS http://localhost:5173
  smoke: ''                   # a single smoke command for the run ladder

gates:
  mode: every-ac              # every-ac | end-of-lane | end
  ai_review_on_skip: false
  bug_gates: true             # false, or `keel state start fix --no-gates`, auto-approves R and F

# The run ladder. `ladder: []` runs every rung; listing a subset marks the rest as not-checked
# rather than hiding them, which is how a seven-rung run used to look like a twelve-rung one.
setup:
  ladder: []                  # e.g. [toolchain, dependencies, compile, unit-tests]
  max_parallel: 4             # rungs of one level at a time
  fix_attempts_per_rung: 3    # after this many failures the rung becomes a blocking question
  runbook: docs/RUNNING.md

# /keel:hunt proposes these lenses and asks you to confirm the set before anything fans out.
# A seventh lens is a line here plus a brief in the hunt skill's references/lenses.md — the
# flow, the guards and the agents do not change.
hunt:
  lenses: [security, behavioral, technical, concurrency, idempotency, contract-drift, test-integrity, data-migration]
  # Which half of the tree each lens reads. Two lanes means two hunters, each given half — which is
  # what keeps a wide sweep affordable. `both` means one agent that must see both sides:
  # contract-drift's subject is the disagreement between them, so splitting it blinds it.
  lens_lanes:
    security: [api, web]
    behavioral: [web, api]
    technical: [api, web]
    concurrency: [api]
    idempotency: [api, web]
    contract-drift: [both]
    test-integrity: [api, web]
    data-migration: [api]
  dedup_line_window: 10       # same file within N lines = the same finding, seen twice
  severity_floor_5xx: high    # a proven 5xx cannot be filed below this
  default_scope: diff         # all | diff | <comma-separated paths>
  max_candidates_per_lens: 12
  prove_concurrency: 4
  report_dir: docs/hunts

loops:
  stall_repeats: 3
  flaky_reruns: 1
  green_author: main          # main | subagent

tests:
  per_ac_scope: changed-packages
  module_suite_at: gate       # every-ac | gate | lane-end

coverage:
  changed_lines: 95
  changed_branches: 90
  per_ac: warn                # off | warn | enforce
  global: ratchet             # a number, or ratchet to never drop below the stored baseline
  # Derived from the app directories when omitted; set these only for a custom layout.
  reports:
    api: {{BACKEND_DIR}}/build/reports/kover/report.xml
    web: {{FRONTEND_DIR}}/coverage/lcov.info
  exclude:
    api: ['**/generated/**', '**/*ApplicationKt*']
    web: ['src/api/generated/**', 'src/main.tsx']
  gate_commands: ['git push', 'gh pr create', 'keel pr']

stack:
  compose: {{COMPOSE}}
  per_lane_isolation: true

stop_gate:
  enabled: true
  max_blocks_per_turn: 1

caps:
  red_turns: 8
  green_turns: 15
  e2e_turns: 40
  ship_rounds: 2
